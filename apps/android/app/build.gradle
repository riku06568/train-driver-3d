plugins {
    id 'com.android.application'
}

// リポジトリ直下（Web版のルート）をそのまま取り込む
def webRoot = rootProject.file('../..')
def wwwDir = file('src/main/assets/www')

tasks.register('syncWebAssets', Sync) {
    group = 'build'
    description = 'Web版（汐見環状線3D）を Android アセットへコピーする'
    from(webRoot) {
        include 'index.html'
        include 'manifest.json'
        include 'cab_preview.html'
        include 'assets/**'
        exclude 'assets/icons/icon-1024.png'
    }
    into wwwDir
}

// PWA用の Service Worker は WebView では不要
tasks.register('stripServiceWorker', Delete) {
    delete file('src/main/assets/www/sw.js')
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets', 'stripServiceWorker'
}
// コピー後に SW を消す（順序保証）
tasks.named('stripServiceWorker') {
    mustRunAfter 'syncWebAssets'
}

android {
    namespace 'io.github.riku06568.shiomi3d'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.riku06568.shiomi3d'
        minSdk 24
        targetSdk 34
        versionCode 251
        versionName '2.5.1'
        resourceConfigurations += ['ja', 'en']
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // 無料配布用: ストア提出をしないため、CIランナーの debug 鍵で署名する
            // （鍵ファイルをリポジトリに置かないため。上書きインストールできない場合は
            //   一度アンインストールしてから入れ直す）
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // 音声・画像は再圧縮しない（読み込み速度とサイズのバランス）
        noCompress += ['mp3', 'wav', 'ogg', 'webp', 'm4a', 'mp4']
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
